name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: false
        default: release
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "
24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "
84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-arm-dbt-license
          echo -e "
d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo -e "
24333f8a63b6825ea9c5514f83c2829b004d1fee" >> $ANDROID_HOME/licenses/android-sdk-license
          echo -e "
84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
          echo -e "
e6b7c2ab7fa2298c15165e9583d02223f6602273" >> $ANDROID_HOME/licenses/android-sdk-license

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build APK (Debug)
        if: inputs.build_type == 'debug'
        run: ./gradlew assembleDebug --no-daemon

      - name: Build APK (Release)
        if: inputs.build_type == 'release'
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-${{ github.run_number }}
          path: |
            **/build/outputs/apk/**/*.apk
          retention-days: 7
          if-no-files-found: error
